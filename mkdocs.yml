site_name: Dataforge
site_description: Gerador de datasets sintéticos relacionais
site_author: Carlos Oliveira
site_url: https://ckoliveiraa.github.io/DataForge/
repo_name: DataForge
repo_url: https://github.com/ckoliveiraa/DataForge
edit_uri: edit/main/docs/

docs_dir: docs
theme:
  name: material
  language: pt
  logo: assets/logo-icon.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ckoliveiraa/DataForge

nav:
  - Início: index.md
  - Instalação:
    - Docker: instalacao/docker.md
    - Sem Docker (Poetry): instalacao/poetry.md
  - Interface Visual:
    - Visão geral: frontend/visao-geral.md
    - Geração com IA: frontend/ia.md
    - Diagrama relacional: frontend/diagrama.md
    - Catálogo Faker: frontend/faker.md
    - Exportar e importar YAML: frontend/yaml.md
  - CLI:
    - Referência completa: cli/referencia.md
    - Exemplos práticos: cli/exemplos.md
  - Schemas:
    - Schema YAML customizado: schemas/yaml.md
    - Domínios prontos: schemas/dominios.md
    - Tipos de dados (dtype): schemas/dtypes.md
  - Saída de dados:
    - Formatos: saida/formatos.md
    - Particionamento: saida/particionamento.md
    - Upload em nuvem: saida/cloud.md
    - Carga SQL: saida/sql.md
  - Avançado:
    - Modo recorrente: avancado/recorrencia.md
    - Reprodutibilidade: avancado/seed.md
    - Arquitetura: avancado/arquitetura.md
