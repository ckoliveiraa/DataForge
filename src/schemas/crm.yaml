domain: crm

tables:
  companies:
    rows: 200
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: company
      document:
        dtype: str
        nullable: 0.2
      industry:
        dtype: str
      size:
        dtype: str
      website:
        dtype: str
        nullable: 0.4
      city:
        dtype: city
      country:
        dtype: country
      annual_revenue:
        dtype: float
        nullable: 0.5
      created_at:
        dtype: date

  contacts:
    rows: 600
    columns:
      id:
        dtype: int_seq
        primary_key: true
      company_id:
        dtype: int
        foreign_key:
          table: companies
          column: id
        nullable: 0.3
      first_name:
        dtype: name
      last_name:
        dtype: name
      email:
        dtype: email
      phone:
        dtype: phone
        nullable: 0.2
      job_title:
        dtype: str
        nullable: 0.3
      active:
        dtype: bool
      created_at:
        dtype: date

  pipelines:
    rows: 5
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: str
      description:
        dtype: text
        nullable: 0.4

  pipeline_stages:
    rows: 20
    columns:
      id:
        dtype: int_seq
        primary_key: true
      pipeline_id:
        dtype: int
        foreign_key:
          table: pipelines
          column: id
      name:
        dtype: str
      order:
        dtype: int
      win_probability:
        dtype: float

  deals:
    rows: 800
    columns:
      id:
        dtype: int_seq
        primary_key: true
      title:
        dtype: str
      company_id:
        dtype: int
        foreign_key:
          table: companies
          column: id
        nullable: 0.2
      contact_id:
        dtype: int
        foreign_key:
          table: contacts
          column: id
        nullable: 0.2
      stage_id:
        dtype: int
        foreign_key:
          table: pipeline_stages
          column: id
      owner_name:
        dtype: name
      amount:
        dtype: float
        nullable: 0.3
      expected_close_date:
        dtype: date
        nullable: 0.3
      actual_close_date:
        dtype: date
        nullable: 0.6
      status:
        dtype: str
      created_at:
        dtype: date

  activities:
    rows: 2000
    columns:
      id:
        dtype: int_seq
        primary_key: true
      type:
        dtype: str
      deal_id:
        dtype: int
        foreign_key:
          table: deals
          column: id
        nullable: 0.3
      contact_id:
        dtype: int
        foreign_key:
          table: contacts
          column: id
        nullable: 0.3
      subject:
        dtype: str
      notes:
        dtype: text
        nullable: 0.4
      owner_name:
        dtype: name
      scheduled_at:
        dtype: date
      completed_at:
        dtype: date
        nullable: 0.4
      status:
        dtype: str

  tickets:
    rows: 1000
    columns:
      id:
        dtype: int_seq
        primary_key: true
      subject:
        dtype: str
      contact_id:
        dtype: int
        foreign_key:
          table: contacts
          column: id
        nullable: 0.2
      company_id:
        dtype: int
        foreign_key:
          table: companies
          column: id
        nullable: 0.2
      priority:
        dtype: str
      status:
        dtype: str
      category:
        dtype: str
        nullable: 0.3
      assigned_to:
        dtype: name
        nullable: 0.3
      description:
        dtype: text
      resolution:
        dtype: text
        nullable: 0.6
      created_at:
        dtype: date
      resolved_at:
        dtype: date
        nullable: 0.6
