domain: crm

tables:
  companies:
    rows: 200
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: company
      document:
        dtype: str
        faker_provider: bothify
        nullable: 0.2
      industry:
        dtype: str
        choices: [Technology, Finance, Healthcare, Retail, Manufacturing, Education, Logistics, Energy, Telecom, Agriculture, Real Estate, Media]
      size:
        dtype: str
        choices: [micro, small, medium, large, enterprise]
      website:
        dtype: url
        nullable: 0.4
      city:
        dtype: city
      country:
        dtype: country
      annual_revenue:
        dtype: float
        min: 50000
        max: 10000000000
        nullable: 0.5
      created_at:
        dtype: date

  contacts:
    rows: 600
    columns:
      id:
        dtype: int_seq
        primary_key: true
      company_id:
        dtype: int
        foreign_key:
          table: companies
          column: id
        nullable: 0.3
      first_name:
        dtype: str
        faker_provider: first_name
      last_name:
        dtype: str
        faker_provider: last_name
      email:
        dtype: email
      phone:
        dtype: phone
        nullable: 0.2
      job_title:
        dtype: str
        faker_provider: job
        nullable: 0.3
      active:
        dtype: bool
      created_at:
        dtype: date

  pipelines:
    rows: 5
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: str
        choices: [New Business, Renewal, Upsell, Partnership, Enterprise]
      description:
        dtype: text
        nullable: 0.4

  pipeline_stages:
    rows: 20
    columns:
      id:
        dtype: int_seq
        primary_key: true
      pipeline_id:
        dtype: int
        foreign_key:
          table: pipelines
          column: id
      name:
        dtype: str
        choices: [Prospecting, Qualification, Proposal, Negotiation, Closed Won, Closed Lost]
      order:
        dtype: int
        min: 1
        max: 10
      win_probability:
        dtype: float
        min: 0
        max: 1

  deals:
    rows: 800
    columns:
      id:
        dtype: int_seq
        primary_key: true
      title:
        dtype: str
        faker_provider: catch_phrase
      company_id:
        dtype: int
        foreign_key:
          table: companies
          column: id
        nullable: 0.2
      contact_id:
        dtype: int
        foreign_key:
          table: contacts
          column: id
        nullable: 0.2
      stage_id:
        dtype: int
        foreign_key:
          table: pipeline_stages
          column: id
      owner_name:
        dtype: name
      amount:
        dtype: float
        min: 1000
        max: 5000000
        nullable: 0.3
      expected_close_date:
        dtype: date
        nullable: 0.3
      actual_close_date:
        dtype: date
        nullable: 0.6
      status:
        dtype: str
        choices: [open, won, lost, abandoned, on_hold]
      created_at:
        dtype: date

  activities:
    rows: 2000
    columns:
      id:
        dtype: int_seq
        primary_key: true
      type:
        dtype: str
        choices: [call, meeting, email, demo, proposal, follow_up, task]
      deal_id:
        dtype: int
        foreign_key:
          table: deals
          column: id
        nullable: 0.3
      contact_id:
        dtype: int
        foreign_key:
          table: contacts
          column: id
        nullable: 0.3
      subject:
        dtype: str
        faker_provider: sentence
      notes:
        dtype: text
        nullable: 0.4
      owner_name:
        dtype: name
      scheduled_at:
        dtype: date
      completed_at:
        dtype: date
        nullable: 0.4
      status:
        dtype: str
        choices: [scheduled, completed, cancelled, no_show]

  tickets:
    rows: 1000
    columns:
      id:
        dtype: int_seq
        primary_key: true
      subject:
        dtype: str
        faker_provider: sentence
      contact_id:
        dtype: int
        foreign_key:
          table: contacts
          column: id
        nullable: 0.2
      company_id:
        dtype: int
        foreign_key:
          table: companies
          column: id
        nullable: 0.2
      priority:
        dtype: str
        choices: [low, medium, high, critical]
      status:
        dtype: str
        choices: [open, in_progress, waiting, resolved, closed]
      category:
        dtype: str
        choices: [billing, technical, general, complaint, feature_request]
        nullable: 0.3
      assigned_to:
        dtype: name
        nullable: 0.3
      description:
        dtype: text
      resolution:
        dtype: text
        nullable: 0.6
      created_at:
        dtype: date
      resolved_at:
        dtype: date
        nullable: 0.6
