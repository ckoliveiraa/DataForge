domain: transacoes
tables:
  transacoes:
    rows: 50000
    columns:
      transacao_id:
        dtype: uuid
        primary_key: true
      metodo_pagamento:
        dtype: str
        choices:
          - Pix
          - Crédito
          - Débito
          - Boleto
      data_transacao:
        dtype: date
        min: -1y
        max: today
      cliente_id:
        dtype: uuid
        foreign_key:
          table: clientes
          column: cliente_id
  clientes:
    rows: 500
    columns:
      cliente_id:
        dtype: uuid
        primary_key: true
      nome:
        dtype: str
        faker_provider: name
      cep:
        dtype: str
        faker_provider: postcode
      cidade:
        dtype: str
        faker_provider: address
