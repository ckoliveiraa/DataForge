domain: hr

tables:
  departments:
    rows: 12
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: str
        choices: [Engineering, Sales, Marketing, Finance, HR, Operations, Legal, Customer Success, Product, Data, IT, Executive]
      code:
        dtype: str
        faker_provider: bothify
      location:
        dtype: city
      cost_center:
        dtype: str
        faker_provider: bothify
        nullable: 0.2

  job_titles:
    rows: 30
    columns:
      id:
        dtype: int_seq
        primary_key: true
      title:
        dtype: str
        faker_provider: job
      level:
        dtype: str
        choices: [intern, junior, pleno, senior, specialist, lead, coordinator, manager, director, VP, C-level]
      min_salary:
        dtype: float
        min: 1500
        max: 20000
      max_salary:
        dtype: float
        min: 2000
        max: 60000

  employees:
    rows: 300
    columns:
      id:
        dtype: int_seq
        primary_key: true
      first_name:
        dtype: str
        faker_provider: first_name
      last_name:
        dtype: str
        faker_provider: last_name
      email:
        dtype: email
      phone:
        dtype: phone
        nullable: 0.1
      cpf:
        dtype: str
        faker_provider: numerify
      birth_date:
        dtype: date
        min: -45y
        max: -18y
      hire_date:
        dtype: date
        min: -10y
        max: today
      termination_date:
        dtype: date
        nullable: 0.8
      department_id:
        dtype: int
        foreign_key:
          table: departments
          column: id
      job_title_id:
        dtype: int
        foreign_key:
          table: job_titles
          column: id
      manager_id:
        dtype: int
        foreign_key:
          table: employees
          column: id
        nullable: 0.15
      active:
        dtype: bool

  salaries:
    rows: 400
    columns:
      id:
        dtype: int_seq
        primary_key: true
      employee_id:
        dtype: int
        foreign_key:
          table: employees
          column: id
      amount:
        dtype: float
        min: 1500
        max: 60000
      currency:
        dtype: currency
      effective_date:
        dtype: date
      end_date:
        dtype: date
        nullable: 0.3

  benefits:
    rows: 20
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: str
        choices: [Health Insurance, Dental, Vision, Life Insurance, Meal Voucher, Transport Voucher, Gym, Home Office Allowance, Stock Options, Profit Sharing]
      description:
        dtype: text
        nullable: 0.2
      monthly_value:
        dtype: float
        min: 50
        max: 2000

  employee_benefits:
    rows: 600
    columns:
      id:
        dtype: int_seq
        primary_key: true
      employee_id:
        dtype: int
        foreign_key:
          table: employees
          column: id
      benefit_id:
        dtype: int
        foreign_key:
          table: benefits
          column: id
      start_date:
        dtype: date
      end_date:
        dtype: date
        nullable: 0.5

  leave_requests:
    rows: 500
    columns:
      id:
        dtype: int_seq
        primary_key: true
      employee_id:
        dtype: int
        foreign_key:
          table: employees
          column: id
      type:
        dtype: str
        choices: [vacation, sick, maternity, paternity, personal, bereavement, study]
      start_date:
        dtype: date
      end_date:
        dtype: date
      status:
        dtype: str
        choices: [pending, approved, rejected, cancelled]
      approved_by:
        dtype: int
        foreign_key:
          table: employees
          column: id
        nullable: 0.3

  trainings:
    rows: 50
    columns:
      id:
        dtype: int_seq
        primary_key: true
      title:
        dtype: str
        faker_provider: catch_phrase
      description:
        dtype: text
        nullable: 0.2
      duration_hours:
        dtype: int
        min: 1
        max: 80
      instructor:
        dtype: name
      scheduled_date:
        dtype: date

  employee_trainings:
    rows: 800
    columns:
      id:
        dtype: int_seq
        primary_key: true
      employee_id:
        dtype: int
        foreign_key:
          table: employees
          column: id
      training_id:
        dtype: int
        foreign_key:
          table: trainings
          column: id
      completed:
        dtype: bool
      completion_date:
        dtype: date
        nullable: 0.4
      score:
        dtype: float
        min: 0
        max: 10
        nullable: 0.5
