domain: ecommerce

tables:
  categories:
    rows: 20
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: str
        choices: [Electronics, Clothing, Home & Kitchen, Sports, Books, Beauty, Toys, Automotive, Food & Grocery, Office Supplies]
      description:
        dtype: text
        nullable: 0.2
      slug:
        dtype: str

  products:
    rows: 200
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: str
      description:
        dtype: text
        nullable: 0.1
      price:
        dtype: float
        min: 1
        max: 5000
      stock_quantity:
        dtype: int
        min: 0
        max: 500
      sku:
        dtype: str
      weight_kg:
        dtype: float
        min: 0.1
        max: 50
        nullable: 0.3
      category_id:
        dtype: int
        foreign_key:
          table: categories
          column: id
      active:
        dtype: bool
      created_at:
        dtype: date

  customers:
    rows: 500
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: name
      email:
        dtype: email
      phone:
        dtype: phone
        nullable: 0.1
      city:
        dtype: city
      state:
        dtype: str
        choices: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
      country:
        dtype: country
      zip_code:
        dtype: str
        nullable: 0.2
      created_at:
        dtype: date

  orders:
    rows: 1000
    columns:
      id:
        dtype: int_seq
        primary_key: true
      customer_id:
        dtype: int
        foreign_key:
          table: customers
          column: id
      status:
        dtype: str
        choices: [pending, processing, shipped, delivered, cancelled, returned]
      total_amount:
        dtype: float
        min: 1
        max: 10000
      discount_amount:
        dtype: float
        min: 0
        max: 500
        nullable: 0.4
      shipping_address:
        dtype: text
        nullable: 0.1
      ordered_at:
        dtype: date
      delivered_at:
        dtype: date
        nullable: 0.3

  order_items:
    rows: 3000
    columns:
      id:
        dtype: int_seq
        primary_key: true
      order_id:
        dtype: int
        foreign_key:
          table: orders
          column: id
      product_id:
        dtype: int
        foreign_key:
          table: products
          column: id
      quantity:
        dtype: int
        min: 1
        max: 20
      unit_price:
        dtype: float
        min: 1
        max: 5000
      discount_pct:
        dtype: float
        min: 0
        max: 0.5
        nullable: 0.5

  payments:
    rows: 1000
    columns:
      id:
        dtype: int_seq
        primary_key: true
      order_id:
        dtype: int
        foreign_key:
          table: orders
          column: id
      method:
        dtype: str
        choices: [credit_card, debit_card, pix, boleto, bank_transfer, wallet]
      status:
        dtype: str
        choices: [pending, paid, failed, refunded, cancelled]
      amount:
        dtype: float
        min: 1
        max: 10000
      paid_at:
        dtype: date
        nullable: 0.2

  reviews:
    rows: 800
    columns:
      id:
        dtype: int_seq
        primary_key: true
      product_id:
        dtype: int
        foreign_key:
          table: products
          column: id
      customer_id:
        dtype: int
        foreign_key:
          table: customers
          column: id
      rating:
        dtype: int
        min: 1
        max: 5
      comment:
        dtype: text
        nullable: 0.4
      created_at:
        dtype: date
