domain: manutencao

tables:
  assets:
    rows: 200
    columns:
      id:
        dtype: int_seq
        primary_key: true
      tag:
        dtype: str
      name:
        dtype: str
      description:
        dtype: text
        nullable: 0.2
      type:
        dtype: str
        choices: [equipment, vehicle, infrastructure, tool, instrument, facility, IT]
      manufacturer:
        dtype: company
      model:
        dtype: str
        nullable: 0.1
      serial_number:
        dtype: str
      location:
        dtype: str
        choices: [Plant A, Plant B, Warehouse, Office, Field, Lab, Server Room]
      purchase_date:
        dtype: date
        nullable: 0.3
      purchase_value:
        dtype: float
        min: 500
        max: 2000000
        nullable: 0.3
      active:
        dtype: bool

  technicians:
    rows: 30
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: name
      email:
        dtype: email
      phone:
        dtype: phone
      specialization:
        dtype: str
        choices: [electrical, mechanical, hydraulic, instrumentation, civil, IT, HVAC, welding]
      active:
        dtype: bool

  maintenance_types:
    rows: 15
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: str
        choices: [Preventive, Corrective, Predictive, Inspection, Calibration, Lubrication, Cleaning, Overhaul]
      description:
        dtype: text
        nullable: 0.3
      is_preventive:
        dtype: bool

  work_orders:
    rows: 800
    columns:
      id:
        dtype: int_seq
        primary_key: true
      code:
        dtype: str
      asset_id:
        dtype: int
        foreign_key:
          table: assets
          column: id
      maintenance_type_id:
        dtype: int
        foreign_key:
          table: maintenance_types
          column: id
      technician_id:
        dtype: int
        foreign_key:
          table: technicians
          column: id
        nullable: 0.2
      priority:
        dtype: str
        choices: [low, medium, high, critical, emergency]
      status:
        dtype: str
        choices: [open, in_progress, on_hold, waiting_parts, completed, cancelled]
      description:
        dtype: text
      failure_description:
        dtype: text
        nullable: 0.5
      requested_at:
        dtype: date
      scheduled_at:
        dtype: date
        nullable: 0.3
      started_at:
        dtype: date
        nullable: 0.4
      completed_at:
        dtype: date
        nullable: 0.5
      estimated_hours:
        dtype: float
        min: 0.5
        max: 200
        nullable: 0.3
      actual_hours:
        dtype: float
        min: 0.5
        max: 200
        nullable: 0.5
      labor_cost:
        dtype: float
        min: 50
        max: 50000
        nullable: 0.5
      total_cost:
        dtype: float
        min: 50
        max: 100000
        nullable: 0.5

  parts:
    rows: 300
    columns:
      id:
        dtype: int_seq
        primary_key: true
      code:
        dtype: str
      name:
        dtype: str
      description:
        dtype: text
        nullable: 0.3
      unit:
        dtype: str
        choices: [un, kg, L, m, pc, cx, par, rolo, set]
      stock_quantity:
        dtype: int
        min: 0
        max: 500
      min_stock:
        dtype: int
        min: 1
        max: 50
      unit_cost:
        dtype: float
        min: 1
        max: 50000
      supplier:
        dtype: company
        nullable: 0.2

  work_order_parts:
    rows: 1200
    columns:
      id:
        dtype: int_seq
        primary_key: true
      work_order_id:
        dtype: int
        foreign_key:
          table: work_orders
          column: id
      part_id:
        dtype: int
        foreign_key:
          table: parts
          column: id
      quantity:
        dtype: int
        min: 1
        max: 50
      unit_cost:
        dtype: float
        min: 1
        max: 50000

  preventive_plans:
    rows: 100
    columns:
      id:
        dtype: int_seq
        primary_key: true
      asset_id:
        dtype: int
        foreign_key:
          table: assets
          column: id
      maintenance_type_id:
        dtype: int
        foreign_key:
          table: maintenance_types
          column: id
      frequency_days:
        dtype: int
        min: 1
        max: 365
      last_execution:
        dtype: date
        nullable: 0.3
      next_execution:
        dtype: date
      active:
        dtype: bool
