domain: finance

tables:
  accounts:
    rows: 500
    columns:
      id:
        dtype: int_seq
        primary_key: true
      account_number:
        dtype: str
        faker_provider: bban
      name:
        dtype: str
        faker_provider: catch_phrase
      type:
        dtype: str
        choices: [checking, savings, investment, credit, escrow]
      currency:
        dtype: currency
      balance:
        dtype: float
        min: -50000
        max: 500000
      active:
        dtype: bool
      created_at:
        dtype: date

  cost_centers:
    rows: 20
    columns:
      id:
        dtype: int_seq
        primary_key: true
      code:
        dtype: str
        faker_provider: bothify
      name:
        dtype: str
        faker_provider: catch_phrase
      description:
        dtype: text
        nullable: 0.3

  budget_categories:
    rows: 30
    columns:
      id:
        dtype: int_seq
        primary_key: true
      name:
        dtype: str
        faker_provider: catch_phrase
      type:
        dtype: str
        choices: [revenue, expense, investment, transfer]
      parent_id:
        dtype: int
        foreign_key:
          table: budget_categories
          column: id
        nullable: 0.5

  transactions:
    rows: 5000
    columns:
      id:
        dtype: int_seq
        primary_key: true
      account_id:
        dtype: int
        foreign_key:
          table: accounts
          column: id
      category_id:
        dtype: int
        foreign_key:
          table: budget_categories
          column: id
        nullable: 0.2
      cost_center_id:
        dtype: int
        foreign_key:
          table: cost_centers
          column: id
        nullable: 0.3
      type:
        dtype: str
        choices: [credit, debit, transfer, reversal]
      amount:
        dtype: float
        min: 0.01
        max: 100000
      description:
        dtype: text
        nullable: 0.2
      reference:
        dtype: str
        faker_provider: bothify
        nullable: 0.4
      transaction_date:
        dtype: date
      due_date:
        dtype: date
        nullable: 0.3
      paid_at:
        dtype: date
        nullable: 0.4
      status:
        dtype: str
        choices: [pending, completed, cancelled, failed, processing]

  invoices:
    rows: 1000
    columns:
      id:
        dtype: int_seq
        primary_key: true
      invoice_number:
        dtype: str
        faker_provider: bothify
      type:
        dtype: str
        choices: [NF-e, NFS-e, CT-e, NF, MDF-e]
      issuer_name:
        dtype: name
      issuer_document:
        dtype: str
        faker_provider: bothify
      recipient_name:
        dtype: name
      recipient_document:
        dtype: str
        faker_provider: bothify
      gross_amount:
        dtype: float
        min: 1
        max: 500000
      tax_amount:
        dtype: float
        min: 0
        max: 100000
      net_amount:
        dtype: float
        min: 1
        max: 500000
      issue_date:
        dtype: date
      due_date:
        dtype: date
      status:
        dtype: str
        choices: [issued, cancelled, paid, pending, overdue]

  budgets:
    rows: 200
    columns:
      id:
        dtype: int_seq
        primary_key: true
      cost_center_id:
        dtype: int
        foreign_key:
          table: cost_centers
          column: id
      category_id:
        dtype: int
        foreign_key:
          table: budget_categories
          column: id
      year:
        dtype: int
        min: 2020
        max: 2026
      month:
        dtype: int
        min: 1
        max: 12
      planned_amount:
        dtype: float
        min: 1000
        max: 500000
      actual_amount:
        dtype: float
        min: 0
        max: 500000
        nullable: 0.3

  tax_records:
    rows: 300
    columns:
      id:
        dtype: int_seq
        primary_key: true
      tax_type:
        dtype: str
        choices: [IRPJ, CSLL, PIS, COFINS, ISS, ICMS, IOF, IPI, IRRF]
      reference_period:
        dtype: str
        choices: ["2023-01", "2023-02", "2023-03", "2023-04", "2023-05", "2023-06", "2023-07", "2023-08", "2023-09", "2023-10", "2023-11", "2023-12", "2024-01", "2024-02", "2024-03", "2024-04", "2024-05", "2024-06", "2024-07", "2024-08", "2024-09", "2024-10", "2024-11", "2024-12"]
      base_amount:
        dtype: float
        min: 1000
        max: 1000000
      tax_rate:
        dtype: float
        min: 0.01
        max: 0.35
      tax_amount:
        dtype: float
        min: 10
        max: 350000
      due_date:
        dtype: date
      paid_at:
        dtype: date
        nullable: 0.4
      status:
        dtype: str
        choices: [pending, paid, overdue, contested, cancelled]
