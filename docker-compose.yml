services:

  # ── Frontend + CLI integrado ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataforge-frontend
    ports:
      - "5173:5173"
    volumes:
      # Schemas editáveis sem rebuild
      - ./schemas:/app/schemas
      - ./src/schemas:/app/src/schemas
      # Output persistido no host
      - ./output:/app/output
      # Hot reload do código Python
      - ./src/dataforge:/app/src/dataforge
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped

  # ── CLI standalone (uso via docker compose run) ───────────────────────────
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataforge-cli
    volumes:
      - ./schemas:/app/schemas
      - ./src/schemas:/app/src/schemas
      - ./output:/app/output
      - ./src/dataforge:/app/src/dataforge
    environment:
      - PYTHONPATH=/app/src
    # Sobrescreve o CMD padrão — não inicia servidor, aguarda comandos
    entrypoint: ["dataset-gen"]
    command: ["--help"]
    profiles:
      - cli
