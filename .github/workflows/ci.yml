name: CI

on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check src/"

      - uses: astral-sh/ruff-action@v3
        with:
          args: "check src/"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[parquet,avro]"
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=dataforge --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  open-pr:
    name: Open PR to main
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $BRANCH — skipping."
          else
            printf '## Automated PR\n\nOpened automatically after CI passed on `%s`.\n\n**Commit:** %s\n\n### Checklist\n- [x] Lint passed\n- [x] Tests passed\n- [ ] Manual review\n' "$BRANCH" "$SHA" > /tmp/pr_body.md
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "feat: merge ${BRANCH} into main" \
              --body-file /tmp/pr_body.md
          fi
