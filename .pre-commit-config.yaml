repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest --cov
        entry: pytest --cov=src/dataforge --cov-report=term-missing -q
        language: system
        pass_filenames: false
        always_run: true

      - id: frontend-test
        name: vitest (frontend)
        entry: bash -c 'cd src/dataforge/frontend && npm test'
        language: system
        pass_filenames: false
        files: ^src/dataforge/frontend/src/.*\.(ts|tsx)$
