[project]
name = "dataforge"
version = "0.1.8"
description = "Synthetic relational dataset generator for data engineering studies"
authors = [
    {name = "Carlos Oliveira", email = "papodedados@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9.0",
    "faker>=24.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
]

[project.optional-dependencies]
gcp     = ["google-cloud-storage>=2.0"]
aws     = ["boto3>=1.34"]
azure   = ["azure-storage-blob>=12.0"]
parquet = ["pyarrow>=16.0"]
avro    = ["fastavro>=1.9"]
sql     = ["sqlalchemy>=2.0"]
postgres = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
mysql   = ["sqlalchemy>=2.0", "pymysql>=1.1"]
mssql   = ["sqlalchemy>=2.0", "pyodbc>=5.0"]
all     = [
    "google-cloud-storage>=2.0", "boto3>=1.34", "azure-storage-blob>=12.0",
    "pyarrow>=16.0", "fastavro>=1.9",
    "sqlalchemy>=2.0", "psycopg2-binary>=2.9", "pymysql>=1.1",
]

[project.scripts]
dataset-gen = "dataforge.cli:cli"

[tool.poetry]
packages = [{include = "dataforge", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4"
taskipy = { version = ">=1.12", python = ">=3.6,<4.0" }
pre-commit = ">=3.7"
pytest = ">=8.0"
pytest-cov = ">=5.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"

[tool.taskipy.tasks]
lint   = "ruff check src/"
fmt    = "ruff format src/"
check  = "ruff format src/ --check && ruff check src/"
test   = "pytest tests/ -v"
ci     = "ruff format src/ --check && ruff check src/ && pytest tests/ -v --cov=dataforge --cov-report=term-missing"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/dataforge"]
omit = ["src/dataforge/frontend/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long — já controlado pelo formatter
]

[tool.ruff.lint.isort]
known-first-party = ["dataforge"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
