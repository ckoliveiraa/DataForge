[project]
name = "dataforge"
version = "0.1.0"
description = "Synthetic relational dataset generator for data engineering studies"
authors = [
    {name = "Carlos Oliveira", email = "papodedados@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9.0",
    "faker>=24.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "sqlalchemy (>=2.0.49,<3.0.0)",
]

[project.optional-dependencies]
gcp     = ["google-cloud-storage>=2.0"]
aws     = ["boto3>=1.34"]
azure   = ["azure-storage-blob>=12.0"]
parquet = ["pyarrow>=16.0"]
avro    = ["fastavro>=1.9"]
sql     = ["sqlalchemy>=2.0"]
postgres = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
mysql   = ["sqlalchemy>=2.0", "pymysql>=1.1"]
mssql   = ["sqlalchemy>=2.0", "pyodbc>=5.0"]
all     = [
    "google-cloud-storage>=2.0", "boto3>=1.34", "azure-storage-blob>=12.0",
    "pyarrow>=16.0", "fastavro>=1.9",
    "sqlalchemy>=2.0", "psycopg2-binary>=2.9", "pymysql>=1.1",
]

[project.scripts]
dataset-gen = "dataforge.cli:cli"

[tool.poetry]
packages = [{include = "dataforge", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
